version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ghostwriter-postgres-local
    environment:
      POSTGRES_DB: ghostwriter_db
      POSTGRES_USER: ghostwriter_user
      POSTGRES_PASSWORD: ghostwriter_local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostwriter_user -d ghostwriter_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
