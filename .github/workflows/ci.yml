name: Ghostwriter CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Contracts Package
        run: npm --workspace=@ghostwriter/contracts run build --if-present

      - name: Build Web Application
        run: npm --workspace=web run build

      - name: Verify Bundle Outputs
        run: |
          test -d apps/web/dist/web || (echo "Web build output missing!" && exit 1)
          echo "Production Angular build verified successfully!"
