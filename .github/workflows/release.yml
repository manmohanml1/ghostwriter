name: Ghostwriter Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify annotated tag and release source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag" || {
            echo "Release tags must be annotated."
            exit 1
          }
          git fetch origin master --no-tags
          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$release_commit" origin/master || {
            echo "Release tag must point to a commit reachable from origin/master."
            exit 1
          }
          expected_version="${RELEASE_TAG#v}"
          root_version="$(node -p "require('./package.json').version")"
          web_version="$(node -p "require('./apps/web/package.json').version")"
          test "$root_version" = "$expected_version" && test "$web_version" = "$expected_version" || {
            echo "Tag, root package, and web package versions must match."
            exit 1
          }

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Verify release source completely
        run: npm run verify

      - name: Package immutable web artifact
        run: |
          cd apps/web/dist/web
          zip -r "../../../../ghostwriter-web-${GITHUB_REF_NAME}.zip" browser 3rdpartylicenses.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "ghostwriter-web-${GITHUB_REF_NAME}.zip"
          --verify-tag
          --title "Ghostwriter ${GITHUB_REF_NAME}"
          --generate-notes
