name: Ghostwriter Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Contracts Package
        run: npm --workspace=@ghostwriter/contracts run build --if-present

      - name: Build Web Application
        run: npm --workspace=web run build

      - name: Package immutable web artifact
        run: |
          cd apps/web/dist/web
          zip -r "../../../../ghostwriter-web-${GITHUB_REF_NAME}.zip" browser 3rdpartylicenses.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "ghostwriter-web-${GITHUB_REF_NAME}.zip"
          --verify-tag
          --title "Ghostwriter ${GITHUB_REF_NAME}"
          --generate-notes
